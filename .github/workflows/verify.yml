name: Verify research snapshot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recompute counts and check file hashes
        run: python scripts/verify_snapshot.py
      - name: Inspect all real text cases
        run: python scripts/inspect_case.py --all
      - name: Verify production audit and curated visual cases
        run: python scripts/verify_production.py
      - name: Check casebook against the source cases
        run: python scripts/build_casebook.py --check-markdown
      - name: Verify cc update and frozen 75-case sample
        run: python scripts/spotcheck_review.py --verify
      - name: Verify consensus progress and 24 paired paths
        run: python scripts/review_progress.py
      - name: Verify October 8 inventory and one-path-per-task selection
        run: python scripts/verify_sft_audit.py
      - name: Verify the merged V2 KEEP release
        run: python scripts/verify_v2_release.py
      - name: Verify the additive V2.1 KEEP release
        run: python scripts/verify_v2_1_release.py
